
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP样式优化演示</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background: #f5f5f4;
      color: #1f2937;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px;
    }
    .panel {
      width: 460px;
      background: #fbfbfa;
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 18px 44px rgba(15,23,42,.08);
    }
    .card {
      border: 1px solid #dce6f5;
      border-radius: 22px;
      background: #fff;
      padding: 16px;
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }
    .badge {
      font-size: 12px;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 4px 10px;
      background: #fff;
    }
    .url {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.5;
      word-break: break-all;
    }
    .start {
      border: none;
      background: #111827;
      color: #fff;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .flow {
      border: 1px dashed #d7e2f0;
      border-radius: 18px;
      background: #fdfdfd;
      padding: 14px;
    }
    .tip {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .actions-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .ghost-btn {
      border: 1px solid #d4dbe6;
      background: #fff;
      color: #475569;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .otp-row {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid #d4dbe6;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      min-width: 164px;
    }
    .otp-code {
      padding: 10px 16px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
      color: #111827;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .otp-side {
      border-left: 1px solid #e5e7eb;
      min-width: 54px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #64748b;
      background: #fafafa;
      font-variant-numeric: tabular-nums;
    }
    .hint {
      font-size: 12px;
      color: #94a3b8;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: rgba(17,24,39,.94);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="card">
        <div class="title-row">
          <div class="title">KSOPS运维平台</div>
          <div class="badge">需要 OTP</div>
        </div>
        <div class="url">https://pssc.gac.com.cn/wps_cluster/ksops/</div>
        <button class="start" id="startBtn">开始登录</button>

        <div class="flow">
          <div class="tip">已用新窗口打开KSOPS运维平台，并自动复制账号。继续完成登录：</div>

          <div class="actions-top">
            <button class="ghost-btn" id="copyUser">复制账号</button>
            <button class="ghost-btn" id="copyPwd">复制密码</button>

            <div class="otp-row">
              <div class="otp-code" id="otpCode" title="点击复制验证码">883 985</div>
              <div class="otp-side" id="otpTimer">11s</div>
            </div>
          </div>

          <div class="hint">验证码直接显示，点击数字可复制；倒计时与验证码同区，不再挤在底部。</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const toast = document.getElementById('toast');
    const timerEl = document.getElementById('otpTimer');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
    }

    document.getElementById('startBtn').onclick = () => showToast('已用新窗口打开KSOPS运维平台，并复制账号');
    document.getElementById('copyUser').onclick = () => showToast('已复制账号');
    document.getElementById('copyPwd').onclick = () => showToast('已复制密码');
    document.getElementById('otpCode').onclick = () => showToast('已复制验证码 883985');

    let remain = 11;
    setInterval(() => {
      remain -= 1;
      if (remain <= 0) remain = 30;
      timerEl.textContent = remain + 's';
    }, 1000);
  </script>
</body>
</html>
