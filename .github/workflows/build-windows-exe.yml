name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: windows-exe
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Show runner info
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          python --version
          python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Build onedir package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_exe.ps1 -SkipInstall

      - name: Build onefile package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_onefile.ps1 -SkipInstall

      - name: Compress onedir package
        shell: pwsh
        run: Compress-Archive -Path dist\Chattodo -DestinationPath dist\Chattodo-windows-onedir.zip -Force

      - name: Upload onedir zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir-zip
          path: dist\Chattodo-windows-onedir.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload onefile exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-onefile-exe
          path: dist\Chattodo.exe
          if-no-files-found: error
          retention-days: 1
