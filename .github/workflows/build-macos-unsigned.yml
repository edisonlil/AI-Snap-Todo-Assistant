name: Build macOS Unsigned

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runs_on: macos-15
            target_arch: arm64
          - name: macos-intel
            runs_on: macos-15-intel
            target_arch: x86_64

    runs-on: ${{ matrix.runs_on }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show runner info
        run: |
          uname -a
          python --version
          python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Build unsigned app
        run: |
          chmod +x scripts/build_macos_app.sh
          ./scripts/build_macos_app.sh --skip-install --target-arch ${{ matrix.target_arch }}

      - name: Compress app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/AICA.app dist/AICA-${{ matrix.name }}.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-app
          path: dist/AICA.app
          if-no-files-found: error
          retention-days: 1

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-zip
          path: dist/AICA-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 1
